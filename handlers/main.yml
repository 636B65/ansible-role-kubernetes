---
- name: Apply Kubernetes networking sysctls
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  tags:
    - prerequisites

- name: Restart containerd
  ansible.builtin.service:
    name: containerd
    state: restarted
  tags:
    - prerequisites
    - registry

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  tags:
    - prerequisites

- name: Restart HAProxy
  ansible.builtin.service:
    name: haproxy
    state: restarted
  tags:
    - loadbalancer

- name: Restart Keepalived
  ansible.builtin.service:
    name: keepalived
    state: restarted
  tags:
    - loadbalancer

- name: Reload Kubernetes host firewall
  ansible.builtin.systemd:
    name: kubernetes-firewall.service
    state: reloaded
  tags:
    - firewall
