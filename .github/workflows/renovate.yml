name: Renovate

# Runs Renovate here on a schedule, since the Renovate app is not installed on
# this repository. It opens pull requests for the pinned component versions in
# defaults/main.yml as configured in renovate.json, and keeps a dependency
# dashboard issue. Needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General). Pull requests opened with the
# workflow token start no workflow runs, so after Renovate this workflow starts
# "CI and release" and "Offline bundle build" on every open Renovate pull
# request that has no checks for its current commit yet.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push Renovate's branches
      pull-requests: write # open its pull requests
      issues: write # keep the Dependency Dashboard issue
      actions: write # start the checks on Renovate's branches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
          # Only the command in renovate.json's postUpgradeTasks may run.
          RENOVATE_ALLOWED_COMMANDS: '["^\\.github/scripts/sync-defaults\\.sh$"]'

      - name: Start the checks on Renovate's pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("renovate/")) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            # A pull_request run for the bot's pull request is created but
            # waits for approval (action_required); it does not count.
            runs="$(gh run list --workflow ci-release.yml --commit "$sha" --json conclusion \
              --jq '[.[] | select(.conclusion != "action_required")] | length')"
            if [[ "$runs" != "0" ]]; then
              echo "$branch: already checked"
              continue
            fi
            echo "$branch: starting the checks for $sha"
            gh workflow run ci-release.yml --ref "$branch"
            gh workflow run offline-build.yml --ref "$branch"
          done
