name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and lint tools
        run: python -m pip install --upgrade ansible-core ansible-lint shellcheck-py

      - name: Install nftables for firewall rule validation
        run: sudo apt-get update && sudo apt-get install --yes nftables

      - name: Set up local role path
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: |
          mkdir -p "$ANSIBLE_ROLES_PATH"
          ln -s "$GITHUB_WORKSPACE" "$ANSIBLE_ROLES_PATH/ansible-role-kubernetes"

      - name: Lint role and examples
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: ansible-lint .

      - name: Syntax-check example playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: |
          ansible-playbook --syntax-check \
            -i tests/inventory.yml \
            tests/syntax.yml
          ansible-playbook \
            -i tests/inventory.yml \
            tests/render.yml
          for playbook in examples/site.yml examples/upgrade.yml examples/remove-node.yml; do
            ansible-playbook --syntax-check -i examples/inventory.yml "$playbook"
          done

      - name: Render and verify operational templates
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: |
          ansible-playbook -i tests/inventory.yml tests/operations.yml
          output="$RUNNER_TEMP/kubernetes-role-operations"
          sudo nft --check --file "$output/kubernetes-firewall.nft"
          shellcheck "$output/kubernetes-etcd-backup.sh" \
            "$output/kubernetes-offline-stage-debs.sh" \
            tests/idempotence.sh \
            .github/scripts/changelog.sh

  tag-release:
    name: Tag the newest changelog version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create the tag and GitHub Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(.github/scripts/changelog.sh version)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          .github/scripts/changelog.sh notes "${version}" > "$RUNNER_TEMP/release-notes.md"
          # Creating the release also creates the tag on this commit. Tags
          # created with GITHUB_TOKEN do not start other workflow runs, so
          # this job publishes the release itself.
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release from version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi
          if .github/scripts/changelog.sh notes "${TAG_NAME#v}" > "$RUNNER_TEMP/release-notes.md"; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG_NAME" --generate-notes
          fi
