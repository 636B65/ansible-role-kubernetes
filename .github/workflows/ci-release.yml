name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and lint tools
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Set up local role path
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: |
          mkdir -p "$ANSIBLE_ROLES_PATH"
          ln -s "$GITHUB_WORKSPACE" "$ANSIBLE_ROLES_PATH/ansible-role-kubernetes"

      - name: Lint role and examples
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: ansible-lint .

      - name: Syntax-check example playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ runner.temp }}/ansible-roles
        run: |
          ansible-playbook --syntax-check \
            -i tests/inventory.yml \
            tests/syntax.yml
          ansible-playbook \
            -i tests/inventory.yml \
            tests/render.yml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release from version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes
