<text x="174.5" y="548.8" font-size="15" fill="#172B4D" text-anchor="middle" font-weight="bold">Offline bundle</text>
<text x="174.5" y="568.2" font-size="15" fill="#172B4D" text-anchor="middle">/opt/kubernetes-offline</text>
<text x="174.5" y="587.8" font-size="15" fill="#172B4D" text-anchor="middle">.deb repository · image archives</text>
<text x="174.5" y="607.2" font-size="15" fill="#172B4D" text-anchor="middle">charts · manifests · CLIs</text>
<text x="174.5" y="626.8" font-size="15" fill="#172B4D" text-anchor="middle">Staged with offline_stage</text>
<rect x="530" y="112" width="640" height="78" rx="10" fill="#FFF0B3" stroke="#FF8B00" stroke-width="2"/>
<text x="850.0" y="136.8" font-size="15" fill="#172B4D" text-anchor="middle" font-weight="bold">Kubernetes API virtual endpoint</text>
<text x="850.0" y="156.2" font-size="15" fill="#172B4D" text-anchor="middle">Keepalived-managed VIP · active on one controller</text>
<text x="850.0" y="175.8" font-size="15" fill="#172B4D" text-anchor="middle">HAProxy TCP :8443 · round-robin to :6443 with TCP health checks</text>
<rect x="410" y="240" width="1030" height="44" rx="10" fill="#FFFAE6" stroke="#FFAB00" stroke-width="2"/>
<text x="925.0" y="266.9" font-size="14" fill="#5E4DB2" text-anchor="middle"><tspan font-weight="bold">HAProxy backend pool</tspan> · kube-cp01 :6443 · kube-cp02 :6443 · kube-cp03 :6443</text>
<rect x="395" y="320" width="310" height="185" rx="10" fill="#DEEBFF" stroke="#0747A6" stroke-width="2"/>
<text x="550.0" y="353.7" font-size="14" fill="#172B4D" text-anchor="middle" font-weight="bold">kube-cp01</text>
<text x="550.0" y="371.9" font-size="14" fill="#172B4D" text-anchor="middle">Control plane + etcd</text>
<text x="550.0" y="390.1" font-size="14" fill="#172B4D" text-anchor="middle">kube-apiserver :6443</text>
<text x="550.0" y="408.3" font-size="14" fill="#172B4D" text-anchor="middle">audit log · Secret encryption</text>
<text x="550.0" y="426.5" font-size="14" fill="#172B4D" text-anchor="middle">Pod Security (baseline)</text>
<text x="550.0" y="444.7" font-size="14" fill="#172B4D" text-anchor="middle">HAProxy + Keepalived</text>
<text x="550.0" y="462.9" font-size="14" fill="#172B4D" text-anchor="middle">etcd backup timer</text>
<text x="550.0" y="481.1" font-size="14" fill="#172B4D" text-anchor="middle">Registry + Buildah build node</text>
