<rect x="0" y="0" width="1540" height="1130" fill="#FFFFFF"/>
<rect x="355" y="205" width="1140" height="860" rx="28" fill="#F7F9FC" stroke="#7A869A" stroke-width="2" stroke-dasharray="16 8"/>
<text x="383" y="235" font-size="15" fill="#344563" text-anchor="start" font-weight="bold">KUBERNETES CLUSTER</text>
<text x="42" y="57.1" font-size="26" fill="#172B4D" text-anchor="start" font-weight="bold">Kubernetes HA Cluster — Ansible Role Architecture</text>
<text x="44" y="90.25" font-size="15" fill="#526581" text-anchor="start">containerd · kubeadm · Cilium · HAProxy · Keepalived · Longhorn · internal registry · hardening · backups · offline mode</text>
<rect x="42" y="120" width="265" height="115" rx="10" fill="#E6FCFF" stroke="#008DA6" stroke-width="2"/>
<text x="174.5" y="163.2" font-size="15" fill="#172B4D" text-anchor="middle" font-weight="bold">Kubernetes clients</text>
<text x="174.5" y="182.8" font-size="15" fill="#172B4D" text-anchor="middle">kubectl · kubelets · operators</text>
<text x="174.5" y="202.2" font-size="15" fill="#172B4D" text-anchor="middle">Connect to the stable API endpoint</text>
<rect x="42" y="290" width="265" height="150" rx="10" fill="#DEEBFF" stroke="#0052CC" stroke-width="2"/>
<text x="174.5" y="331.2" font-size="15" fill="#172B4D" text-anchor="middle" font-weight="bold">Ansible controller</text>
<text x="174.5" y="350.8" font-size="15" fill="#172B4D" text-anchor="middle">Ansible 2.16+ · SSH + become</text>
<text x="174.5" y="370.2" font-size="15" fill="#172B4D" text-anchor="middle">site.yml: install and configure</text>
<text x="174.5" y="389.8" font-size="15" fill="#172B4D" text-anchor="middle">upgrade.yml: rolling upgrades</text>
<text x="174.5" y="409.2" font-size="15" fill="#172B4D" text-anchor="middle">remove-node.yml: scale in</text>
<rect x="42" y="725" width="265" height="165" rx="10" fill="#EAE6FF" stroke="#6554C0" stroke-width="2"/>
<text x="174.5" y="773.8" font-size="15" fill="#172B4D" text-anchor="middle" font-weight="bold">Upstream sources</text>
<text x="174.5" y="793.2" font-size="15" fill="#172B4D" text-anchor="middle">docker.io · quay.io</text>
<text x="174.5" y="812.8" font-size="15" fill="#172B4D" text-anchor="middle">registry.k8s.io · ghcr.io</text>
<text x="174.5" y="832.2" font-size="15" fill="#172B4D" text-anchor="middle">pkgs.k8s.io · Helm repos</text>
<text x="174.5" y="851.8" font-size="15" fill="#172B4D" text-anchor="middle">All versions and tags pinned</text>
