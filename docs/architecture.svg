<text x="925.0" y="399.2" font-size="14" fill="#172B4D" text-anchor="middle">kube-apiserver :6443</text>
<text x="925.0" y="417.4" font-size="14" fill="#172B4D" text-anchor="middle">audit log · Secret encryption</text>
<text x="925.0" y="435.6" font-size="14" fill="#172B4D" text-anchor="middle">Pod Security (baseline)</text>
<text x="925.0" y="453.8" font-size="14" fill="#172B4D" text-anchor="middle">HAProxy + Keepalived</text>
<text x="925.0" y="472.0" font-size="14" fill="#172B4D" text-anchor="middle">etcd backup timer</text>
<rect x="1145" y="320" width="310" height="185" rx="10" fill="#DEEBFF" stroke="#0747A6" stroke-width="2"/>
<text x="1300.0" y="362.8" font-size="14" fill="#172B4D" text-anchor="middle" font-weight="bold">kube-cp03</text>
<text x="1300.0" y="381.0" font-size="14" fill="#172B4D" text-anchor="middle">Control plane + etcd</text>
<text x="1300.0" y="399.2" font-size="14" fill="#172B4D" text-anchor="middle">kube-apiserver :6443</text>
<text x="1300.0" y="417.4" font-size="14" fill="#172B4D" text-anchor="middle">audit log · Secret encryption</text>
<text x="1300.0" y="435.6" font-size="14" fill="#172B4D" text-anchor="middle">Pod Security (baseline)</text>
<text x="1300.0" y="453.8" font-size="14" fill="#172B4D" text-anchor="middle">HAProxy + Keepalived</text>
<text x="1300.0" y="472.0" font-size="14" fill="#172B4D" text-anchor="middle">etcd backup timer</text>
<rect x="410" y="525" width="1030" height="48" rx="10" fill="#FFFAE6" stroke="#FFAB00" stroke-width="2"/>
<text x="925.0" y="545.1" font-size="13" fill="#5E4DB2" text-anchor="middle">HAProxy runs on all controllers with an identical backend pool. Keepalived moves the API VIP between controllers on failover.</text>
<text x="925.0" y="562.0" font-size="13" fill="#5E4DB2" text-anchor="middle">Every node can run the optional nftables host firewall; apt holds kubelet, kubeadm, and kubectl at the pinned release.</text>
<rect x="410" y="593" width="1030" height="50" rx="10" fill="#E3FCEF" stroke="#00875A" stroke-width="2"/>
<text x="925.0" y="623.2" font-size="15" fill="#006644" text-anchor="middle"><tspan font-weight="bold">Cilium CNI overlay</tspan> · pod networking across all nodes · Hubble Relay + UI for flow visibility</text>
