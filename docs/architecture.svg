<text x="925.0" y="767.0" font-size="15" fill="#172B4D" text-anchor="middle">Longhorn replica</text>
<rect x="1045" y="663" width="400" height="190" rx="10" fill="#EAE6FF" stroke="#6554C0" stroke-width="2"/>
<text x="1245.0" y="717.4" font-size="14" fill="#172B4D" text-anchor="middle" font-weight="bold">Internal registry · 2 pods</text>
<text x="1245.0" y="735.6" font-size="14" fill="#172B4D" text-anchor="middle">NodePort :30500 · registry.k8s.local</text>
<text x="1245.0" y="753.8" font-size="14" fill="#172B4D" text-anchor="middle">Anonymous pull · plain HTTP · trusted network only</text>
<text x="1245.0" y="772.0" font-size="14" fill="#172B4D" text-anchor="middle">Longhorn RWX volume · 3 replicas on workers</text>
<text x="1245.0" y="790.2" font-size="14" fill="#172B4D" text-anchor="middle">Mirrored: pinned images · Cilium images</text>
<text x="1245.0" y="808.4" font-size="14" fill="#172B4D" text-anchor="middle">Built: ubuntu-base · nginx-static skeletons</text>
