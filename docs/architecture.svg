<text x="715.0" y="886.5" font-size="14" fill="#172B4D" text-anchor="middle">Headlamp web UI (ClusterIP, token sign-in)</text>
<text x="715.0" y="904.7" font-size="14" fill="#172B4D" text-anchor="middle">kube-prometheus-stack (optional)</text>
