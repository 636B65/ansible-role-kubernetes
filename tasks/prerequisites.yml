---
- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true
  tags:
    - prerequisites

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\s+swap\s+.*)$'
    replace: '# \1'
    backup: true
  tags:
    - prerequisites

- name: Load required kernel modules
  ansible.builtin.command:
    argv:
      - modprobe
      - "{{ item }}"
  changed_when: false
  loop:
    - overlay
    - br_netfilter
  tags:
    - prerequisites

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"
  tags:
    - prerequisites

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.ip_nonlocal_bind = 1
    owner: root
    group: root
    mode: "0644"
  register: kubernetes_sysctls
  notify: Apply Kubernetes networking sysctls
  tags:
    - prerequisites

- name: Read installed package versions
  ansible.builtin.package_facts:
    manager: apt
  tags:
    - prerequisites

- name: Select the Kubernetes version for new packages
  ansible.builtin.set_fact:
    # Nodes that join an existing cluster get the release its first controller
    # runs, because a kubelet must never be newer than the API server. New
    # clusters get the pinned release; the upgrade flow moves both forward.
    kubernetes_install_version: >-
      {{
        (hostvars[kubernetes_first_controller].ansible_facts.packages.kubeadm[0].version
        | regex_replace('-.*$', ''))
        if 'kubeadm' in hostvars[kubernetes_first_controller].ansible_facts.packages | default({})
        else kubernetes_resolved_version
      }}
  tags:
    - prerequisites

- name: Configure the staged offline package repository first
  ansible.builtin.import_tasks: kubernetes_repository.yml
  vars:
    kubernetes_repository_target_minor: "{{ kubernetes_install_version | regex_search('^[0-9]+\\.[0-9]+') }}"
  when: kubernetes_offline_mode
  tags:
    - prerequisites

- name: Install containerd and required utilities
  ansible.builtin.apt:
    name:
      - "{{ containerd_package }}"
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - prerequisites

- name: Configure the Kubernetes package repository
  ansible.builtin.import_tasks: kubernetes_repository.yml
  vars:
    kubernetes_repository_target_minor: "{{ kubernetes_install_version | regex_search('^[0-9]+\\.[0-9]+') }}"
  when: not kubernetes_offline_mode
  tags:
    - prerequisites

- name: Install the Kubernetes packages that are missing
  ansible.builtin.apt:
    name: >-
      {{
        ['kubelet', 'kubeadm', 'kubectl']
        | reject('in', ansible_facts.packages)
        | map('regex_replace', '$', '=' ~ kubernetes_install_version ~ '-*')
        | list
      }}
    state: present
    allow_change_held_packages: true
    update_cache: true
    cache_valid_time: 3600
  when: >-
    ['kubelet', 'kubeadm', 'kubectl']
    | reject('in', ansible_facts.packages)
    | list
    | length > 0
  tags:
    - prerequisites

- name: Report Kubernetes packages that differ from the pinned version
  ansible.builtin.debug:
    msg: >-
      {{ item }} {{ ansible_facts.packages[item][0].version }} is installed but
      kubernetes_version is {{ kubernetes_resolved_version }}. The role leaves
      installed Kubernetes packages unchanged; run the upgrade playbook to move
      the cluster to the pinned version.
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when:
    - item in ansible_facts.packages
    - not ansible_facts.packages[item][0].version.startswith(kubernetes_resolved_version ~ '-')
  tags:
    - prerequisites

- name: Hold Kubernetes packages so apt cannot upgrade them unplanned
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_held_packages }}"
  tags:
    - prerequisites

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - prerequisites

- name: Generate default containerd configuration if missing
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
  notify: Restart containerd
  tags:
    - prerequisites

- name: Enable systemd cgroups in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd
  tags:
    - prerequisites

- name: Register kubelet with the node's cluster address
  ansible.builtin.lineinfile:
    path: /etc/default/kubelet
    regexp: '^KUBELET_EXTRA_ARGS='
    line: "KUBELET_EXTRA_ARGS=--node-ip={{ kubernetes_node_address }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet
  tags:
    - prerequisites

- name: Ensure containerd and kubelet are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - kubelet
  tags:
    - prerequisites
