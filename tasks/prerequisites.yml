---
- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true
  tags:
    - prerequisites

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\s+swap\s+.*)$'
    replace: '# \1'
    backup: true
  tags:
    - prerequisites

- name: Load required kernel modules
  ansible.builtin.command:
    argv:
      - modprobe
      - "{{ item }}"
  changed_when: false
  loop:
    - overlay
    - br_netfilter
  tags:
    - prerequisites

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"
  tags:
    - prerequisites

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.ip_nonlocal_bind = 1
    owner: root
    group: root
    mode: "0644"
  register: kubernetes_sysctls
  notify: Apply Kubernetes networking sysctls
  tags:
    - prerequisites

- name: Read the latest stable Kubernetes release
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
    timeout: 30
  register: kubernetes_stable_release
  tags:
    - prerequisites

- name: Set Kubernetes package repository version
  ansible.builtin.set_fact:
    kubernetes_release: "{{ kubernetes_stable_release.content | trim }}"
    kubernetes_repository_minor: "{{ kubernetes_stable_release.content | trim | regex_search('^v[0-9]+\\.[0-9]+') }}"
  tags:
    - prerequisites

- name: Install containerd and required utilities
  ansible.builtin.apt: # noqa: package-latest
    name:
      - "{{ containerd_package }}"
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: latest
    update_cache: true
    cache_valid_time: 3600
  tags:
    - prerequisites

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - prerequisites

- name: Add Kubernetes package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repository_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: "0644"
  tags:
    - prerequisites

- name: Configure Kubernetes package repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repository_minor }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: true
  tags:
    - prerequisites

- name: Install latest Kubernetes packages
  ansible.builtin.apt: # noqa: package-latest
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: latest
    update_cache: true
  tags:
    - prerequisites

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - prerequisites

- name: Generate default containerd configuration if missing
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
  notify: Restart containerd
  tags:
    - prerequisites

- name: Enable systemd cgroups in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd
  tags:
    - prerequisites

- name: Ensure containerd and kubelet are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - kubelet
  tags:
    - prerequisites
