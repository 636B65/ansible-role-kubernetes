---
- name: Install HAProxy and Keepalived on controllers
  ansible.builtin.apt:
    name:
      - haproxy
      - keepalived
    state: present
    update_cache: true
  tags:
    - loadbalancer

- name: Check whether systemd-networkd manages the controller network
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - systemd-networkd.service
  register: kubernetes_networkd_active
  changed_when: false
  failed_when: false
  tags:
    - loadbalancer

- name: Create the systemd networkd wait-online override directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: kubernetes_networkd_active.rc == 0
  tags:
    - loadbalancer

- name: Ensure networkd wait-online is not skipped at boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/99-ansible.conf
    content: |
      [Unit]
      ConditionPathIsSymbolicLink=
    owner: root
    group: root
    mode: "0644"
  register: kubernetes_networkd_wait_online_override
  when: kubernetes_networkd_active.rc == 0
  tags:
    - loadbalancer

- name: Reload systemd after configuring networkd wait-online
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - kubernetes_networkd_active.rc == 0
    - kubernetes_networkd_wait_online_override.changed
  tags:
    - loadbalancer

- name: Wait for systemd-networkd to configure the controller interface
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online.service
    state: started
    enabled: true
  when: kubernetes_networkd_active.rc == 0
  tags:
    - loadbalancer

- name: Configure HAProxy for the Kubernetes API
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0600"
    validate: haproxy -c -f %s
  notify: Restart HAProxy
  tags:
    - loadbalancer

- name: Configure Keepalived for the Kubernetes API VIP
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart Keepalived
  tags:
    - loadbalancer
