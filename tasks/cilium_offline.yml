---
- name: Require the registry staging host to be a control-plane node
  ansible.builtin.assert:
    that:
      - kubernetes_registry_node in groups[kubernetes_control_plane_group]
    fail_msg: >-
      Cilium offline staging runs on a control-plane node. Set
      kubernetes_registry_node to a member of {{ kubernetes_control_plane_group }}.
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Ensure Skopeo is installed for Cilium image staging
  ansible.builtin.apt:
    name: skopeo
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Read the running Cilium agent image
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - daemonset
      - cilium
      - --namespace
      - kube-system
      - --output
      - json
  register: kubernetes_cilium_daemonset
  changed_when: false
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Determine the Cilium release installed in the cluster
  ansible.builtin.set_fact:
    kubernetes_cilium_installed_version: >-
      {{
        (
          (kubernetes_cilium_daemonset.stdout | from_json).spec.template.spec.containers
          | selectattr('name', 'equalto', 'cilium-agent')
          | map(attribute='image')
          | first
        )
        | regex_replace('^.*:(v[0-9]+\.[0-9]+\.[0-9]+)(?:@.*)?$', '\1')
      }}
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Validate the installed Cilium version
  ansible.builtin.assert:
    that:
      - kubernetes_cilium_installed_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      Could not determine a stable Cilium version from the running agent image.
      Ensure Cilium is installed and uses a semantic release tag before staging
      offline assets.
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Validate the Helm architecture
  ansible.builtin.assert:
    that:
      - kubernetes_architecture in ['amd64', 'arm64']
    fail_msg: "Helm and the Cilium CLI are not staged for {{ ansible_architecture }}."
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Create the offline asset directories on control-plane nodes
  ansible.builtin.file:
    path: "{{ kubernetes_offline_assets_directory }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - helm
    - cilium
    - cilium-cli
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Download the Helm archive for offline use
  ansible.builtin.get_url:
    url: >-
      https://get.helm.sh/helm-{{ kubernetes_helm_resolved_version }}-linux-{{
      kubernetes_architecture }}.tar.gz
    dest: >-
      {{ kubernetes_offline_assets_directory }}/helm/helm-{{
      kubernetes_helm_resolved_version }}-linux-{{ kubernetes_architecture }}.tar.gz
    mode: "0644"
  when:
    - inventory_hostname in groups[kubernetes_control_plane_group]
    - not kubernetes_offline_mode
  tags:
    - cilium_offline

- name: Create the Helm extraction directory
  ansible.builtin.file:
    path: "/tmp/kubernetes-helm-{{ kubernetes_helm_resolved_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Extract Helm into a versioned temporary directory
  ansible.builtin.unarchive:
    src: >-
      {{ kubernetes_offline_assets_directory }}/helm/helm-{{
      kubernetes_helm_resolved_version }}-linux-{{ kubernetes_architecture }}.tar.gz
    dest: "/tmp/kubernetes-helm-{{ kubernetes_helm_resolved_version }}"
    remote_src: true
    creates: >-
      /tmp/kubernetes-helm-{{ kubernetes_helm_resolved_version }}/linux-{{
      kubernetes_architecture }}/helm
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Install Helm on control-plane nodes
  ansible.builtin.copy:
    src: >-
      /tmp/kubernetes-helm-{{ kubernetes_helm_resolved_version }}/linux-{{
      kubernetes_architecture }}/helm
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Download the Cilium CLI archive for offline use
  ansible.builtin.get_url:
    url: >-
      https://github.com/cilium/cilium-cli/releases/download/{{
      kubernetes_cilium_cli_resolved_version }}/cilium-linux-{{ kubernetes_architecture }}.tar.gz
    dest: "{{ kubernetes_cilium_cli_archive }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname in groups[kubernetes_control_plane_group]
    - not kubernetes_offline_mode
  tags:
    - cilium_offline

- name: Create the Cilium CLI extraction directory
  ansible.builtin.file:
    path: "/tmp/kubernetes-cilium-cli-{{ kubernetes_cilium_cli_resolved_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Extract the Cilium CLI into a versioned temporary directory
  ansible.builtin.unarchive:
    src: "{{ kubernetes_cilium_cli_archive }}"
    dest: "/tmp/kubernetes-cilium-cli-{{ kubernetes_cilium_cli_resolved_version }}"
    remote_src: true
    include:
      - cilium
    creates: "/tmp/kubernetes-cilium-cli-{{ kubernetes_cilium_cli_resolved_version }}/cilium"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Install the Cilium CLI on control-plane nodes
  ansible.builtin.copy:
    src: "/tmp/kubernetes-cilium-cli-{{ kubernetes_cilium_cli_resolved_version }}/cilium"
    dest: /usr/local/bin/cilium
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Check whether each controller already has the Cilium chart archive
  ansible.builtin.stat:
    path: >-
      {{ kubernetes_offline_assets_directory }}/cilium/cilium-{{
      kubernetes_cilium_installed_version }}.tgz
  register: kubernetes_cilium_chart_archive_stat
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Find the controllers that still need the Cilium chart archive
  ansible.builtin.set_fact:
    kubernetes_cilium_chart_missing_hosts: >-
      {{
        groups[kubernetes_control_plane_group]
        | select('in', ansible_play_hosts)
        | map('extract', hostvars)
        | rejectattr('kubernetes_cilium_chart_archive_stat.stat.exists')
        | map(attribute='inventory_hostname')
        | list
      }}
  run_once: true
  tags:
    - cilium_offline

- name: Download the Cilium chart matching the installed release to the Ansible controller
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --location
      - --silent
      - --show-error
      - --retry
      - "3"
      - --retry-all-errors
      - --max-time
      - "120"
      - >-
        https://raw.githubusercontent.com/cilium/charts/master/cilium-{{
        kubernetes_cilium_installed_version | regex_replace('^v', '') }}.tgz
      - --output
      - "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_installed_version }}.tgz"
    creates: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_installed_version }}.tgz"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true
  when:
    - inventory_hostname in groups[kubernetes_control_plane_group]
    - kubernetes_cilium_chart_missing_hosts | length > 0
    - not kubernetes_offline_mode
  tags:
    - cilium_offline

- name: Copy the Cilium chart archive to control-plane nodes
  ansible.builtin.copy:
    src: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_installed_version }}.tgz"
    dest: >-
      {{ kubernetes_offline_assets_directory }}/cilium/cilium-{{
      kubernetes_cilium_installed_version }}.tgz
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname in kubernetes_cilium_chart_missing_hosts
    - not kubernetes_offline_mode
  tags:
    - cilium_offline

- name: Remove the temporary Cilium chart archive from the Ansible controller
  ansible.builtin.file:
    path: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_installed_version }}.tgz"
    state: absent
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true
  when:
    - inventory_hostname in groups[kubernetes_control_plane_group]
    - kubernetes_cilium_chart_missing_hosts | length > 0
    - not kubernetes_offline_mode
  tags:
    - cilium_offline

- name: Read the currently installed Cilium Helm values for image discovery
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - cilium
      - --namespace
      - kube-system
      - --all
      - --output
      - yaml
  register: kubernetes_cilium_helm_values
  changed_when: false
  no_log: true
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Render the installed Cilium configuration and remove temporary values
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline
  block:
    - name: Save the current Cilium values temporarily for chart rendering
      ansible.builtin.copy:
        content: "{{ kubernetes_cilium_helm_values.stdout }}"
        dest: /tmp/kubernetes-cilium-helm-values.yaml
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Render the installed Cilium configuration to discover every enabled image
      ansible.builtin.command:
        argv:
          - helm
          - template
          - cilium
          - "{{ kubernetes_offline_assets_directory }}/cilium/cilium-{{ kubernetes_cilium_installed_version }}.tgz"
          - --namespace
          - kube-system
          - --values
          - /tmp/kubernetes-cilium-helm-values.yaml
      register: kubernetes_cilium_rendered_chart
      changed_when: false
      no_log: true
  always:
    - name: Remove the temporary Cilium values file after image discovery
      ansible.builtin.file:
        path: /tmp/kubernetes-cilium-helm-values.yaml
        state: absent
      changed_when: false

- name: Extract unique upstream image references from the Cilium chart
  ansible.builtin.set_fact:
    kubernetes_cilium_offline_images: >-
      {{
        kubernetes_cilium_rendered_chart.stdout
        | regex_findall('(?m)^\s+image:\s*"?([^"\s]+)')
        | unique
        | list
      }}
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Validate Cilium chart image references before mirroring
  ansible.builtin.assert:
    that:
      - kubernetes_cilium_offline_images | length > 0
      - >-
        kubernetes_cilium_offline_images
        | select('match', '^quay\.io/cilium/')
        | list
        | length == kubernetes_cilium_offline_images | length
    fail_msg: >-
      The installed Cilium chart rendered an empty or unexpected image list.
      Review custom Cilium values before mirroring images into the local registry.
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Check which Cilium images are already in the internal registry
  ansible.builtin.uri:
    url: >-
      http://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
      }}/v2/{{ item | regex_replace('^quay.io/', '')
      | regex_replace('@sha256:.*$', '') | regex_replace(':', '/manifests/') }}
    method: HEAD
    headers:
      Accept: >-
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    status_code:
      - 200
      - 404
    return_content: false
    timeout: 20
  loop: "{{ kubernetes_cilium_offline_images }}"
  register: kubernetes_cilium_registry_images
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Copy missing Cilium images into the internal registry
  ansible.builtin.command:
    argv:
      - skopeo
      - copy
      - --retry-times
      - "3"
      - --all
      - --dest-tls-verify=false
      - >-
        {{
          'docker-archive:' ~ kubernetes_image_archive
          if kubernetes_offline_mode
          else 'docker://' ~ (item.item | regex_replace('@sha256:.*$', ''))
        }}
      - >-
        docker://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
        }}/{{ item.item | regex_replace('^quay.io/', '') | regex_replace('@sha256:.*$', '') }}
  vars:
    kubernetes_image_ref: "{{ item.item }}"
  loop: "{{ kubernetes_cilium_registry_images.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  register: kubernetes_cilium_image_copy
  changed_when: true
  retries: 3
  delay: 10
  until: kubernetes_cilium_image_copy.rc == 0
  when:
    - inventory_hostname == kubernetes_registry_node
    - item.status == 404 or kubernetes_registry_images_force_refresh
  tags:
    - cilium_offline

- name: Verify mirrored Cilium image tags in the internal registry
  ansible.builtin.uri:
    url: >-
      http://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
      }}/v2/{{ item | regex_replace('^quay.io/', '')
      | regex_replace('@sha256:.*$', '') | regex_replace(':', '/manifests/') }}
    method: HEAD
    headers:
      Accept: >-
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    status_code: 200
    return_content: false
    timeout: 20
  loop: "{{ kubernetes_cilium_offline_images }}"
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline
