---
- name: Require the registry staging host to be a control-plane node
  ansible.builtin.assert:
    that:
      - kubernetes_registry_node in groups[kubernetes_control_plane_group]
    fail_msg: >-
      Cilium offline staging runs on a control-plane node. Set
      kubernetes_registry_node to a member of {{ kubernetes_control_plane_group }}.
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Ensure Skopeo is installed for Cilium image staging
  ansible.builtin.apt:
    name: skopeo
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Read the running Cilium agent image
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - daemonset
      - cilium
      - --namespace
      - kube-system
      - --output
      - json
  register: kubernetes_cilium_daemonset
  changed_when: false
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Determine the Cilium release installed in the cluster
  ansible.builtin.set_fact:
    kubernetes_cilium_version: >-
      {{
        (
          (kubernetes_cilium_daemonset.stdout | from_json).spec.template.spec.containers
          | selectattr('name', 'equalto', 'cilium-agent')
          | map(attribute='image')
          | first
        )
        | regex_replace('^.*:(v[0-9]+\.[0-9]+\.[0-9]+)(?:@.*)?$', '\1')
      }}
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Validate the installed Cilium version
  ansible.builtin.assert:
    that:
      - kubernetes_cilium_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      Could not determine a stable Cilium version from the running agent image.
      Ensure Cilium is installed and uses a semantic release tag before staging
      offline assets.
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Read stable Helm v3 releases
  ansible.builtin.uri:
    url: "{{ kubernetes_helm_releases_url }}"
    return_content: true
    headers:
      Accept: application/vnd.github+json
    timeout: 30
  register: kubernetes_helm_releases
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Select the latest stable Helm v3 release
  ansible.builtin.set_fact:
    kubernetes_helm_release: >-
      {{
        kubernetes_helm_releases.json
        | selectattr('tag_name', 'match', '^v3\.')
        | selectattr('prerelease', 'equalto', false)
        | first
      }}
    kubernetes_helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Validate the Helm release architecture
  ansible.builtin.assert:
    that:
      - kubernetes_helm_arch in ['amd64', 'arm64']
      - kubernetes_helm_release.tag_name is match('^v3\.[0-9]+\.[0-9]+$')
    fail_msg: "No stable Helm v3 release is available for {{ ansible_architecture }}."
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Create the offline asset directories on control-plane nodes
  ansible.builtin.file:
    path: "{{ kubernetes_offline_assets_directory }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - helm
    - cilium
    - cilium-cli
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Download the Helm archive for offline use
  ansible.builtin.get_url:
    url: >-
      https://get.helm.sh/helm-{{ kubernetes_helm_release.tag_name }}-linux-{{
      kubernetes_helm_arch }}.tar.gz
    dest: >-
      {{ kubernetes_offline_assets_directory }}/helm/helm-{{
      kubernetes_helm_release.tag_name }}-linux-{{ kubernetes_helm_arch }}.tar.gz
    mode: "0644"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Create the Helm extraction directory
  ansible.builtin.file:
    path: "/tmp/kubernetes-helm-{{ kubernetes_helm_release.tag_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Extract Helm into a versioned temporary directory
  ansible.builtin.unarchive:
    src: >-
      {{ kubernetes_offline_assets_directory }}/helm/helm-{{
      kubernetes_helm_release.tag_name }}-linux-{{ kubernetes_helm_arch }}.tar.gz
    dest: "/tmp/kubernetes-helm-{{ kubernetes_helm_release.tag_name }}"
    remote_src: true
    creates: >-
      /tmp/kubernetes-helm-{{ kubernetes_helm_release.tag_name }}/linux-{{
      kubernetes_helm_arch }}/helm
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Install Helm on control-plane nodes
  ansible.builtin.copy:
    src: >-
      /tmp/kubernetes-helm-{{ kubernetes_helm_release.tag_name }}/linux-{{
      kubernetes_helm_arch }}/helm
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Read the latest stable Cilium CLI release
  ansible.builtin.uri:
    url: https://api.github.com/repos/cilium/cilium-cli/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github+json
    timeout: 30
  register: kubernetes_offline_cilium_cli_release
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Select the Cilium CLI archive for this controller architecture
  ansible.builtin.set_fact:
    kubernetes_offline_cilium_cli_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}"
    kubernetes_offline_cilium_cli_archive_url: >-
      {{
        kubernetes_offline_cilium_cli_release.json.assets
        | selectattr(
            'name',
            'equalto',
            'cilium-linux-'
            ~ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '')
            ~ '.tar.gz'
          )
        | map(attribute='browser_download_url')
        | first
        | default('')
      }}
    kubernetes_offline_cilium_cli_version: "{{ kubernetes_offline_cilium_cli_release.json.tag_name }}"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Validate the Cilium CLI release architecture
  ansible.builtin.assert:
    that:
      - kubernetes_offline_cilium_cli_arch in ['amd64', 'arm64']
      - kubernetes_offline_cilium_cli_archive_url | length > 0
    fail_msg: "No Cilium CLI Linux archive is available for {{ ansible_architecture }}."
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Download the Cilium CLI archive for offline use
  ansible.builtin.get_url:
    url: "{{ kubernetes_offline_cilium_cli_archive_url }}"
    dest: >-
      {{ kubernetes_offline_assets_directory }}/cilium-cli/cilium-cli-{{
      kubernetes_offline_cilium_cli_version }}-linux-{{
      kubernetes_offline_cilium_cli_arch }}.tar.gz
    mode: "0644"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Create the Cilium CLI extraction directory
  ansible.builtin.file:
    path: "/tmp/kubernetes-cilium-cli-{{ kubernetes_offline_cilium_cli_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Extract the Cilium CLI into a versioned temporary directory
  ansible.builtin.unarchive:
    src: >-
      {{ kubernetes_offline_assets_directory }}/cilium-cli/cilium-cli-{{
      kubernetes_offline_cilium_cli_version }}-linux-{{
      kubernetes_offline_cilium_cli_arch }}.tar.gz
    dest: "/tmp/kubernetes-cilium-cli-{{ kubernetes_offline_cilium_cli_version }}"
    remote_src: true
    include:
      - cilium
    creates: >-
      /tmp/kubernetes-cilium-cli-{{ kubernetes_offline_cilium_cli_version }}/cilium
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Install the Cilium CLI on control-plane nodes
  ansible.builtin.copy:
    src: "/tmp/kubernetes-cilium-cli-{{ kubernetes_offline_cilium_cli_version }}/cilium"
    dest: /usr/local/bin/cilium
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Download the Cilium chart matching the installed release to the Ansible controller
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --location
      - --silent
      - --show-error
      - --retry
      - "3"
      - --retry-all-errors
      - --max-time
      - "120"
      - >-
        https://raw.githubusercontent.com/cilium/charts/master/cilium-{{
        kubernetes_cilium_version | regex_replace('^v', '') }}.tgz
      - --output
      - "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_version }}.tgz"
    creates: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_version }}.tgz"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Copy the Cilium chart archive to control-plane nodes
  ansible.builtin.copy:
    src: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_version }}.tgz"
    dest: >-
      {{ kubernetes_offline_assets_directory }}/cilium/cilium-{{
      kubernetes_cilium_version }}.tgz
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Remove the temporary Cilium chart archive from the Ansible controller
  ansible.builtin.file:
    path: "/tmp/kubernetes-offline-cilium-{{ kubernetes_cilium_version }}.tgz"
    state: absent
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  tags:
    - cilium_offline

- name: Read the currently installed Cilium Helm values for image discovery
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - cilium
      - --namespace
      - kube-system
      - --all
      - --output
      - yaml
  register: kubernetes_cilium_helm_values
  changed_when: false
  no_log: true
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Render the installed Cilium configuration and remove temporary values
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline
  block:
    - name: Save the current Cilium values temporarily for chart rendering
      ansible.builtin.copy:
        content: "{{ kubernetes_cilium_helm_values.stdout }}"
        dest: /tmp/kubernetes-cilium-helm-values.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render the installed Cilium configuration to discover every enabled image
      ansible.builtin.command:
        argv:
          - helm
          - template
          - cilium
          - "{{ kubernetes_offline_assets_directory }}/cilium/cilium-{{ kubernetes_cilium_version }}.tgz"
          - --namespace
          - kube-system
          - --values
          - /tmp/kubernetes-cilium-helm-values.yaml
      register: kubernetes_cilium_rendered_chart
      changed_when: false
      no_log: true
  always:
    - name: Remove the temporary Cilium values file after image discovery
      ansible.builtin.file:
        path: /tmp/kubernetes-cilium-helm-values.yaml
        state: absent

- name: Extract unique upstream image references from the Cilium chart
  ansible.builtin.set_fact:
    kubernetes_cilium_offline_images: >-
      {{
        kubernetes_cilium_rendered_chart.stdout
        | regex_findall('(?m)^\s+image:\s*"?([^"\s]+)')
        | unique
        | list
      }}
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Validate Cilium chart image references before mirroring
  ansible.builtin.assert:
    that:
      - kubernetes_cilium_offline_images | length > 0
      - >-
        kubernetes_cilium_offline_images
        | select('match', '^quay\.io/cilium/')
        | list
        | length == kubernetes_cilium_offline_images | length
    fail_msg: >-
      The installed Cilium chart rendered an empty or unexpected image list.
      Review custom Cilium values before mirroring images into the local registry.
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Copy enabled Cilium images into the internal registry
  ansible.builtin.command:
    argv:
      - skopeo
      - copy
      - --retry-times
      - "3"
      - --all
      - --dest-tls-verify=false
      - "docker://{{ item | regex_replace('@sha256:.*$', '') }}"
      - >-
        docker://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
        }}/{{ item | regex_replace('^quay.io/', '') | regex_replace('@sha256:.*$', '') }}
  loop: "{{ kubernetes_cilium_offline_images }}"
  register: kubernetes_cilium_image_copy
  changed_when: true
  retries: 3
  delay: 10
  until: kubernetes_cilium_image_copy.rc == 0
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline

- name: Verify mirrored Cilium image tags in the internal registry
  ansible.builtin.uri:
    url: >-
      http://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
      }}/v2/{{ item | regex_replace('^quay.io/', '')
      | regex_replace('@sha256:.*$', '') | regex_replace(':', '/manifests/') }}
    method: HEAD
    headers:
      Accept: >-
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    status_code: 200
    return_content: false
    timeout: 20
  loop: "{{ kubernetes_cilium_offline_images }}"
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - cilium_offline
