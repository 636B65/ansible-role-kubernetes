---
- name: Check if the first controller is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: first_controller_admin_conf
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

- name: Stop HAProxy on controllers before initial API server bootstrap
  ansible.builtin.service:
    name: haproxy
    state: stopped
  when:
    - inventory_hostname in groups[kubernetes_control_plane_group]
    - not hostvars[groups[kubernetes_control_plane_group][0]].first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Render the kubeadm configuration for the first controller
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - not first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Initialize Kubernetes on the first controller
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config=/etc/kubernetes/kubeadm-config.yaml
      - --upload-certs
  changed_when: true
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - not first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Check initialization state of the first controller
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: first_controller_admin_conf
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

- name: Create root kubectl configuration directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Configure kubectl for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Find the SSH user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ loginusername }}"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Create kubectl configuration directory for the SSH user
  ansible.builtin.file:
    path: "{{ getent_passwd[loginusername][4] }}/.kube"
    state: directory
    owner: "{{ loginusername }}"
    mode: "0700"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Configure kubectl for the SSH user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ getent_passwd[loginusername][4] }}/.kube/config"
    remote_src: true
    owner: "{{ loginusername }}"
    mode: "0600"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

# admin.conf points at the API VIP, so the VIP must answer before the Cilium
# steps below. The remaining controllers are started after bootstrap.
- name: Start the load balancer on the first controller so the API VIP answers
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - keepalived
    - haproxy
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap
    - loadbalancer

- name: Wait for the API VIP to accept connections
  ansible.builtin.wait_for:
    host: "{{ kubernetes_api_vip }}"
    port: "{{ kubernetes_api_port }}"
    timeout: 120
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap
    - loadbalancer

- name: Check Cilium CLI release architecture
  ansible.builtin.assert:
    that:
      - kubernetes_architecture in ['amd64', 'arm64']
    fail_msg: "The Cilium CLI is not available for {{ ansible_architecture }}."
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

- name: Create the Cilium CLI archive directory
  ansible.builtin.file:
    path: "{{ kubernetes_offline_assets_directory }}/cilium-cli"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

- name: Download the pinned Cilium CLI
  ansible.builtin.get_url:
    url: >-
      https://github.com/cilium/cilium-cli/releases/download/{{
      kubernetes_cilium_cli_resolved_version }}/cilium-linux-{{ kubernetes_architecture }}.tar.gz
    dest: "{{ kubernetes_cilium_cli_archive }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - not kubernetes_offline_mode
  tags:
    - bootstrap

- name: Extract Cilium CLI
  ansible.builtin.unarchive:
    src: "{{ kubernetes_cilium_cli_archive }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - cilium
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

- name: Set Cilium CLI permissions
  ansible.builtin.file:
    path: /usr/local/bin/cilium
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname == groups[kubernetes_control_plane_group][0]
  tags:
    - bootstrap

# Existence, not health: Hubble pods stay Pending until workers join, and
# cilium install fails on an existing release.
- name: Check whether Cilium is already installed
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_kubeconfig }}"
      - get
      - daemonset
      - cilium
      - --namespace
      - kube-system
  register: cilium_status_check
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap

- name: Unpack the staged Cilium chart for an offline installation
  ansible.builtin.unarchive:
    src: "{{ kubernetes_cilium_chart_archive }}"
    dest: /tmp
    remote_src: true
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
    - cilium_status_check.rc != 0
    - kubernetes_offline_mode
  tags:
    - bootstrap

- name: Install the pinned Cilium release into the cluster
  ansible.builtin.command:
    argv: >-
      {{
        ['cilium', 'install', '--version', kubernetes_cilium_resolved_version]
        + (['--chart-directory', '/tmp/cilium'] if kubernetes_offline_mode else [])
        + (kubernetes_cilium_install_values | map('regex_replace', '^', '--set=') | list)
      }}
  changed_when: true
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
    - cilium_status_check.rc != 0
  tags:
    - bootstrap

# Hubble Relay and UI cannot schedule on the tainted controller before workers
# join; observability.yml waits for the full cilium status afterwards.
- name: Wait for the Cilium agent and operator to become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_admin_kubeconfig }}"
      - rollout
      - status
      - "{{ item }}"
      - --namespace
      - kube-system
      - --timeout=300s
  loop:
    - daemonset/cilium
    - deployment/cilium-operator
  changed_when: false
  when:
    - inventory_hostname == groups[kubernetes_control_plane_group][0]
    - first_controller_admin_conf.stat.exists
  tags:
    - bootstrap
