---
- name: Inspect any existing registry deployment before storage migration
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - deployment
      - kubernetes-image-registry
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --output
      - json
  register: kubernetes_registry_existing_deployment
  changed_when: false
  failed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Detect the legacy single-node registry storage
  ansible.builtin.set_fact:
    kubernetes_registry_legacy_data_volume: >-
      {{
        (kubernetes_registry_existing_deployment.stdout | from_json).spec.template.spec.volumes
        | selectattr('name', 'equalto', 'registry-data')
        | list
        | first
        | default({})
      }}
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_deployment.rc == 0
  tags:
    - registry_deploy

- name: Determine whether legacy registry data needs migration
  ansible.builtin.set_fact:
    kubernetes_registry_needs_storage_migration: >-
      {{
        kubernetes_registry_legacy_data_volume.hostPath.path
        | default('') == kubernetes_registry_storage_path
      }}
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_deployment.rc == 0
  tags:
    - registry_deploy

- name: Inspect an existing registry storage claim before resizing
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pvc
      - registry-data
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --output
      - json
  register: kubernetes_registry_existing_pvc
  changed_when: false
  failed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Inspect the Longhorn volume behind the current registry claim
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - volumes.longhorn.io
      - "{{ (kubernetes_registry_existing_pvc.stdout | from_json).spec.volumeName }}"
      - --namespace
      - longhorn-system
      - --output
      - json
  register: kubernetes_registry_existing_volume
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_pvc.rc == 0
  tags:
    - registry_deploy

- name: Require the existing Longhorn volume to be inspectable before proceeding
  ansible.builtin.assert:
    that:
      - kubernetes_registry_existing_volume.rc == 0
    fail_msg: >-
      Existing registry PVC registry-data refers to a Longhorn volume that
      could not be inspected. No storage claim will be deleted or resized.
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_pvc.rc == 0
  tags:
    - registry_deploy

- name: Inspect existing Longhorn replicas before replacing a failed empty volume
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - replicas.longhorn.io
      - --namespace
      - longhorn-system
      - --output
      - json
  register: kubernetes_registry_existing_replicas
  changed_when: false
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_pvc.rc == 0
    - kubernetes_registry_existing_volume.rc == 0
  tags:
    - registry_deploy

- name: Determine whether the old failed empty registry claim can be replaced safely
  ansible.builtin.set_fact:
    kubernetes_registry_replace_failed_empty_volume: >-
      {{
        (kubernetes_registry_existing_pvc.stdout | from_json).spec.resources.requests.storage
        != kubernetes_registry_storage_size
        and (kubernetes_registry_existing_volume.stdout | from_json).status.state == 'detached'
        and (kubernetes_registry_existing_volume.stdout | from_json).status.robustness == 'faulted'
        and (kubernetes_registry_existing_volume.stdout | from_json).status.actualSize | int == 0
        and
        (
          (kubernetes_registry_existing_replicas.stdout | from_json)['items']
          | selectattr(
              'spec.volumeName',
              'equalto',
              (kubernetes_registry_existing_pvc.stdout | from_json).spec.volumeName
            )
          | length
        ) == 0
      }}
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_pvc.rc == 0
    - kubernetes_registry_existing_volume.rc == 0
  tags:
    - registry_deploy

- name: Refuse to shrink or replace a registry volume that may contain data
  ansible.builtin.assert:
    that:
      - >-
        (kubernetes_registry_existing_pvc.stdout | from_json).spec.resources.requests.storage
        == kubernetes_registry_storage_size
        or kubernetes_registry_replace_failed_empty_volume | default(false)
        or (kubernetes_registry_existing_volume.stdout | from_json).status.state != 'detached'
        or (kubernetes_registry_existing_volume.stdout | from_json).status.robustness != 'faulted'
        or (kubernetes_registry_existing_volume.stdout | from_json).status.actualSize | int != 0
    fail_msg: >-
      The current registry claim has a different size and its Longhorn volume
      is not a detached, faulted, empty volume with no replicas. Back up and
      migrate that volume manually instead of deleting it.
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_existing_pvc.rc == 0
    - kubernetes_registry_existing_volume.rc == 0
  tags:
    - registry_deploy

- name: Change the unused failed registry PV policy to delete
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - pv
      - "{{ (kubernetes_registry_existing_pvc.stdout | from_json).spec.volumeName }}"
      - --type=merge
      - --patch
      - '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
  register: kubernetes_registry_empty_pv_policy
  changed_when: >-
    'patched' in kubernetes_registry_empty_pv_policy.stdout
    and '(no change)' not in kubernetes_registry_empty_pv_policy.stdout
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_replace_failed_empty_volume | default(false)
  tags:
    - registry_deploy

- name: Remove the unused failed registry claim so Longhorn can provision the smaller volume
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - pvc
      - registry-data
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --wait=true
      - --timeout=300s
  register: kubernetes_registry_empty_pvc_delete
  changed_when: "'deleted' in kubernetes_registry_empty_pvc_delete.stdout"
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_replace_failed_empty_volume | default(false)
  tags:
    - registry_deploy

- name: Wait for Longhorn to delete the unused failed empty volume
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - volumes.longhorn.io
      - "{{ (kubernetes_registry_existing_pvc.stdout | from_json).spec.volumeName }}"
      - --namespace
      - longhorn-system
  register: kubernetes_registry_empty_volume_delete
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until: kubernetes_registry_empty_volume_delete.rc != 0
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_replace_failed_empty_volume | default(false)
  tags:
    - registry_deploy

- name: Create the replicated registry storage class and claim
  ansible.builtin.template:
    src: registry-storage.yml.j2
    dest: /tmp/kubernetes-registry-storage.yml
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Apply the replicated registry storage class and claim
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-registry-storage.yml
  register: kubernetes_registry_storage_apply
  changed_when: >-
    'created' in kubernetes_registry_storage_apply.stdout
    or 'configured' in kubernetes_registry_storage_apply.stdout
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Wait for the replicated registry volume to bind
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=jsonpath={.status.phase}=Bound
      - "pvc/registry-data"
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --timeout=600s
  changed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Inspect the existing shared registry HTTP secret
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - secret
      - kubernetes-image-registry-http
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --output
      - json
  register: kubernetes_registry_http_secret
  changed_when: false
  failed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Validate the existing registry HTTP secret
  ansible.builtin.assert:
    that:
      - >-
        kubernetes_registry_http_secret.rc != 0
        or 'http-secret' in (kubernetes_registry_http_secret.stdout | from_json).data
    fail_msg: >-
      Kubernetes Secret kubernetes-image-registry-http exists without its
      required http-secret key. Repair the secret before rolling out registry
      replicas.
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Generate the shared registry HTTP secret if it does not exist
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -hex
      - "32"
  register: kubernetes_registry_http_secret_generated
  changed_when: false
  no_log: true
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_http_secret.rc != 0
  tags:
    - registry_deploy

- name: Set the persistent registry HTTP secret value
  ansible.builtin.set_fact:
    kubernetes_registry_http_secret_value: >-
      {{
        (kubernetes_registry_http_secret.stdout | from_json).data['http-secret'] | b64decode
        if kubernetes_registry_http_secret.rc == 0
        else kubernetes_registry_http_secret_generated.stdout | trim
      }}
  no_log: true
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Render the shared registry HTTP secret
  ansible.builtin.template:
    src: registry-http-secret.yml.j2
    dest: /tmp/kubernetes-registry-http-secret.yml
    owner: root
    group: root
    mode: "0600"
  changed_when: false
  no_log: true
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Apply the shared registry HTTP secret
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-registry-http-secret.yml
  register: kubernetes_registry_http_secret_apply
  changed_when: >-
    'created' in kubernetes_registry_http_secret_apply.stdout
    or 'configured' in kubernetes_registry_http_secret_apply.stdout
  no_log: true
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Remove the temporary registry HTTP secret manifest
  ansible.builtin.file:
    path: /tmp/kubernetes-registry-http-secret.yml
    state: absent
  changed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Stop the legacy registry before copying its data
  ansible.builtin.command:
    argv:
      - kubectl
      - scale
      - deployment/kubernetes-image-registry
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --replicas=0
  changed_when: true
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Wait for the legacy registry pod to stop before migration
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --selector
      - app=kubernetes-image-registry
      - --output
      - name
  register: kubernetes_registry_legacy_pods
  changed_when: false
  until: kubernetes_registry_legacy_pods.stdout | trim == ""
  retries: 60
  delay: 5
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Render a one-time job to copy legacy registry data
  ansible.builtin.template:
    src: registry-migration-job.yml.j2
    dest: /tmp/kubernetes-registry-migration-job.yml
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Remove any previous completed registry migration job
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - job
      - kubernetes-registry-storage-migration
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --ignore-not-found
  changed_when: false
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Run the one-time migration from hostPath to replicated storage
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-registry-migration-job.yml
  register: kubernetes_registry_migration_apply
  changed_when: "'created' in kubernetes_registry_migration_apply.stdout"
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Wait for legacy registry data migration to complete
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=complete
      - job/kubernetes-registry-storage-migration
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --timeout=600s
  changed_when: false
  when:
    - inventory_hostname == kubernetes_registry_node
    - kubernetes_registry_needs_storage_migration | default(false)
  tags:
    - registry_deploy

- name: Render the highly available registry resources
  ansible.builtin.template:
    src: registry.yml.j2
    dest: /tmp/kubernetes-image-registry.yml
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Apply the highly available registry resources
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-image-registry.yml
  register: kubernetes_registry_apply
  changed_when: >-
    'created' in kubernetes_registry_apply.stdout
    or 'configured' in kubernetes_registry_apply.stdout
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy

- name: Wait for both registry replicas to become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment/kubernetes-image-registry
      - --namespace
      - "{{ kubernetes_registry_namespace }}"
      - --timeout=600s
  changed_when: false
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_deploy
