---
- name: Check whether this node has joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_node_kubelet_conf

- name: Find the nodes that still need to join the cluster
  ansible.builtin.set_fact:
    kubernetes_pending_join_hosts: >-
      {%- set pending = [] -%}
      {%- for host in kubernetes_cluster_hosts
          if host != kubernetes_first_controller and host in ansible_play_hosts -%}
      {%- if not hostvars[host].kubernetes_node_kubelet_conf.stat.exists | default(true) -%}
      {%- set _ = pending.append(host) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ pending }}
  when: inventory_hostname == kubernetes_first_controller

- name: Create a join command for the pending nodes
  ansible.builtin.command:
    argv:
      - kubeadm
      - token
      - create
      - --ttl=1h
      - --print-join-command
  changed_when: true
  register: kubernetes_join_command
  no_log: true
  when:
    - inventory_hostname == kubernetes_first_controller
    - kubernetes_pending_join_hosts | length > 0

- name: Upload control-plane certificates for pending controllers and capture the key
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - upload-certs
      - --upload-certs
  changed_when: true
  register: kubernetes_certificate_upload
  no_log: true
  when:
    - inventory_hostname == kubernetes_first_controller
    - kubernetes_pending_join_hosts | select('in', groups[kubernetes_control_plane_group]) | list | length > 0

- name: Share join credentials with the other cluster hosts
  ansible.builtin.set_fact:
    kubernetes_join_command_for_cluster: "{{ kubernetes_join_command.stdout }}"
    kubernetes_control_plane_certificate_key: "{{ kubernetes_certificate_upload.stdout_lines | default([''], true) | last }}"
  no_log: true
  when:
    - inventory_hostname == kubernetes_first_controller
    - kubernetes_pending_join_hosts | length > 0
