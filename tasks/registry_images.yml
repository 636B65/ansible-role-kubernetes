---
- name: Install Skopeo for copying images into the registry
  ansible.builtin.apt:
    name: skopeo
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_images

- name: Check which configured images are already in the internal registry
  ansible.builtin.uri:
    url: >-
      http://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
      }}/v2/{{ item.destination.split(':')[0] }}/manifests/{{ item.destination.split(':')[1] }}
    method: HEAD
    headers:
      Accept: >-
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    status_code:
      - 200
      - 404
    return_content: false
    timeout: 20
  loop: "{{ kubernetes_registry_images }}"
  register: kubernetes_registry_existing_images
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_images

- name: Copy missing configured images into the internal registry
  ansible.builtin.command:
    argv:
      - skopeo
      - copy
      - --retry-times
      - "3"
      - --all
      - --dest-tls-verify=false
      - >-
        {{
          'docker-archive:' ~ kubernetes_image_archive
          if kubernetes_offline_mode
          else 'docker://' ~ item.item.source
        }}
      - "docker://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port }}/{{ item.item.destination }}"
  vars:
    kubernetes_image_ref: "{{ item.item.source }}"
  loop: "{{ kubernetes_registry_existing_images.results | default([]) }}"
  loop_control:
    label: "{{ item.item.destination }}"
  register: kubernetes_registry_image_copy
  changed_when: true
  retries: 3
  delay: 10
  until: kubernetes_registry_image_copy.rc == 0
  when:
    - inventory_hostname == kubernetes_registry_node
    - item.status == 404 or kubernetes_registry_images_force_refresh
  tags:
    - registry_images

- name: Verify the copied image tags in the internal registry
  ansible.builtin.uri:
    url: >-
      http://{{ kubernetes_registry_hostname }}:{{ kubernetes_registry_node_port
      }}/v2/{{ item.destination.split(':')[0] }}/manifests/{{ item.destination.split(':')[1] }}
    method: HEAD
    headers:
      Accept: >-
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    status_code: 200
    return_content: false
    timeout: 20
  loop: "{{ kubernetes_registry_images }}"
  when: inventory_hostname == kubernetes_registry_node
  tags:
    - registry_images
